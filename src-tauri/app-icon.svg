<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- doc-md app icon master (issue #54): "MD" monogram, the D's stem is a
       cyan down-arrow (Markdown + "down" + document). Midnight + cyan palette.
       Regenerate platform icons with: npm run tauri icon src-tauri/app-icon.svg -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="#12203C"/>

  <g transform="translate(-25,0)">
    <!-- M -->
    <path fill="#FFFFFF" d="M190,710 L190,310 L290,310 L360,500 L430,310 L530,310 L530,710 L443,710 L443,470 L383,625 L337,625 L277,470 L277,710 Z"/>

    <!-- D bowl + bars (stem area gets painted over by the arrow) -->
    <path fill="#FFFFFF" fill-rule="evenodd" d="M585,310 L715,310 A170,200 0 0 1 715,710 L585,710 Z M673,398 L715,398 A82,112 0 0 1 715,622 L673,622 Z"/>

    <!-- cyan down-arrow forming the D's stem, tip drops below the baseline -->
