name: Bug report
description: Something in doc-md isn't working right
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: doc-md version
      description: Shown in the installer filename, or check CHANGELOG.md for what you installed.
      placeholder: v0.2.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see? Screenshots welcome — paste them right in.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a note
        2. Click ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Vault size, theme, whether it happens in a fresh vault, console errors, etc.
    validations:
      required: false
