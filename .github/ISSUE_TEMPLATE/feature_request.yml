name: Feature request
description: Suggest an idea or improvement for doc-md
title: "[Feature]: "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation where you miss this feature.
      placeholder: When I'm ... I can't ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives you've considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor / preview
        - Kanban boards
        - Sticky notes
        - Search / links / graph
        - Sync / sharing
        - Themes / UI
        - Other
    validations:
      required: false
