name: Release

# Pushing a v* tag builds installers for all desktop platforms and drafts a
# GitHub Release with the artifacts attached. See RELEASING.md.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          # 24.04, not 22.04: xcap's pipewire bindings (libspa) need a newer
          # libpipewire than 22.04 ships (v0.3.0 release lesson). Trade-off:
          # Linux artifacts require glibc >= 2.39 (distros from ~2024).
          - platform: ubuntu-24.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev libwayland-dev
          # whisper.cpp (transcription feature): CMake to build, libclang for
          # bindgen; ALSA headers for cpal
          sudo apt-get install -y cmake clang libclang-dev libasound2-dev

      # whisper.cpp needs CMake + libclang (bindgen); windows-latest and
      # macos-latest runners ship both preinstalled — verify loudly so a
      # runner-image change fails here, not deep inside a cargo build log.
      - name: Verify CMake is available
        shell: bash
        run: cmake --version

      - name: Point bindgen at LLVM (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          ls "/c/Program Files/LLVM/bin/libclang.dll"
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Universal macOS binaries need both architectures
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run tests
        run: npm test

      # Windows code signing via Azure Artifact Signing (formerly Trusted
      # Signing). Only activates when the Azure secrets/variables exist, so
      # builds stay unsigned-but-working until Azure is set up.
      # Setup guide: docs/SIGNING.md
      - name: Check Windows signing credentials
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$ENDPOINT" ] && [ -n "$ACCOUNT" ] && [ -n "$PROFILE" ]; then
            echo "SIGN_WINDOWS=true" >> "$GITHUB_ENV"
            echo "Windows signing: enabled ($ACCOUNT/$PROFILE)"
          else
            echo "Windows signing: credentials not configured, building unsigned"
          fi

      - name: Install trusted-signing-cli
        if: env.SIGN_WINDOWS == 'true'
        run: cargo install trusted-signing-cli --locked

      # Tauri signs the .exe first, then the installer that wraps it — both
      # get signed in the one build via this config overlay.
      - name: Write Windows signing config
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        run: |
          printf '%s' '{"bundle":{"windows":{"signCommand":"trusted-signing-cli -e ${{ vars.AZURE_SIGNING_ENDPOINT }} -a ${{ vars.AZURE_SIGNING_ACCOUNT }} -c ${{ vars.AZURE_CERT_PROFILE }} -d doc-md %1"}}}' > src-tauri/windows.sign.conf.json
          echo 'SIGN_ARGS=--config src-tauri/windows.sign.conf.json' >> "$GITHUB_ENV"

      - name: Build and upload to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # whisper.cpp's ggml uses std::filesystem (macOS 10.15+); Tauri also
          # derives this from bundle.macOS.minimumSystemVersion — set both so
          # the cmake build and the .app metadata can't drift apart.
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          # Windows signing (trusted-signing-cli reads these; empty = unused)
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # macOS signing + notarization (tauri-action skips these while empty)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "doc-md ${{ github.ref_name }}"
          releaseBody: "See [CHANGELOG.md](https://github.com/paperhurts/doc-md/blob/main/CHANGELOG.md) for details."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ env.SIGN_ARGS }}
